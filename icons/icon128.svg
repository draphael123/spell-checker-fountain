<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#7b68ee"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>
  <g fill="white" filter="url(#glow)">
    <!-- Main sparkle star -->
    <path d="M64 20 L70 54 L104 60 L70 66 L64 100 L58 66 L24 60 L58 54 Z"/>
    <!-- Surrounding sparkles -->
    <circle cx="32" cy="32" r="5"/>
    <circle cx="96" cy="32" r="4"/>
    <circle cx="96" cy="92" r="5"/>
    <circle cx="32" cy="92" r="4"/>
    <!-- Tiny sparkles -->
    <circle cx="48" cy="24" r="2"/>
    <circle cx="80" cy="24" r="2"/>
    <circle cx="104" cy="52" r="2"/>
    <circle cx="104" cy="72" r="2"/>
    <circle cx="80" cy="100" r="2"/>
    <circle cx="48" cy="100" r="2"/>
    <circle cx="24" cy="72" r="2"/>
    <circle cx="24" cy="52" r="2"/>
  </g>
</svg>

